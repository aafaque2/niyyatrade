services:
  - type: web
    name: niyyatrade-backend
    env: node
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma generate && npx prisma migrate deploy && npx tsx prisma/seed.ts && node dist/main
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FMP_API_KEY
        sync: false
